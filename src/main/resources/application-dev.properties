# ============================================================
# Profilo DEV — pensato per l'uso con Docker Compose (vedi docker-compose.yml
# e Dockerfile nella radice del progetto). È il profilo Spring attivo di
# default nel jar compilato con "mvn clean package" (profilo Maven "dev",
# attivo di default: vedi <profiles> in pom.xml), quindi normalmente non c'è
# nulla da configurare a mano per avviare tutto con Docker.
#
# Ogni valore resta comunque sovrascrivibile con una variabile d'ambiente,
# nel caso si voglia puntare a un'istanza SQL Server diversa da quella del
# docker-compose (es. per collegare temporaneamente il jar Docker a un DB
# esterno) senza toccare questo file.
#
# NOTA sulla rigenerazione del database: il servizio "db" del docker-compose
# NON ha un volume dati persistente. Ad ogni "docker compose up --build" (o
# "docker compose down" seguito da "up") il container SQL Server riparte
# vuoto, e il servizio "db-init" ricarica schema.sql + seed.sql da zero prima
# che l'applicazione si avvii: database sempre rigenerato e ripopolato con i
# dati di esempio, ad ogni build.
# ============================================================

# --- Datasource: container "db" del docker-compose (rete interna Docker) ---
spring.datasource.url=jdbc:sqlserver://${DB_HOST:db}:${DB_PORT:1433};databaseName=${DB_NAME:parcoauto};encrypt=${DB_ENCRYPT:false};trustServerCertificate=${DB_TRUST_SERVER_CERT:true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:DevPass_2024!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Pool di connessioni (HikariCP): valori prudenti anche in locale, per abituarsi
# fin da subito agli stessi limiti che si useranno in produzione.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:20000}

# Lo schema/i dati vengono creati dal servizio "db-init" eseguendo schema.sql e
# seed.sql: qui Hibernate deve solo VALIDARE la corrispondenza, non modificarla.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# In sviluppo il frontend può girare sia integrato nel jar (stessa origine, nessun
# problema di CORS) sia separatamente con "ng serve" su localhost:4200.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Segreto di sviluppo: comodo per non dover configurare nulla in locale/Docker, ma
# NON va mai usato in produzione (vedi application-prod.properties, dove è invece
# obbligatorio impostarlo esplicitamente).
app.security.jwt-secret=${JWT_SECRET:segreto_di_sviluppo_docker_non_usare_in_produzione_min32car}
app.security.jwt-expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
