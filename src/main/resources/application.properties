# ============================================================
# Configurazione applicazione - ParcoAuto
#
# Questo file contiene SOLO le impostazioni comuni a tutti gli ambienti.
# Le impostazioni specifiche di ambiente (datasource, CORS, JWT) sono state
# spostate nei file di profilo dedicati, per non mescolare configurazioni
# Docker/sviluppo e configurazioni di produzione nello stesso posto:
#
#   - application-dev.properties   -> pensato per Docker Compose (vedi
#                                       docker-compose.yml): SQL Server gira in
#                                       un container senza volume persistente, e
#                                       un servizio "db-init" ricarica schema.sql
#                                       + seed.sql ad ogni riavvio, così il
#                                       database è sempre rigenerato da zero.
#   - application-prod.properties  -> server di produzione reale (contiene i
#                                       parametri di connessione attualmente in uso).
#
# Quale dei due sia effettivamente attivo lo decide la riga
# "spring.profiles.active" qui sotto: il valore viene impresso nel jar in fase
# di compilazione da Maven, in base al profilo di compilazione scelto (vedi
# <profiles> in pom.xml: "dev" è quello di default).
# ============================================================
spring.application.name=gestione_pattuglie

# Profilo Spring attivo di default nel jar compilato:
#   mvn clean package            -> profilo Maven "dev" (default) -> spring.profiles.active=dev
#   mvn clean package -Pprod     -> profilo Maven "prod"          -> spring.profiles.active=prod
# Il segnaposto @spring.profiles.active@ viene sostituito da Maven in fase di build
# (resource filtering, vedi pom.xml): NON è un placeholder di Spring, per questo usa
# la sintassi "@...@" e non "${...}". Resta comunque sovrascrivibile a runtime, senza
# ricompilare, con la variabile d'ambiente SPRING_PROFILES_ACTIVE (che ha sempre
# precedenza su questo file).
spring.profiles.active=@spring.profiles.active@

# --- JPA / Hibernate (comune a tutti gli ambienti) ---
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# Necessario per poter serializzare le relazioni lazy (es. Veicolo.area) nelle risposte JSON
# dei controller che restituiscono direttamente le entità.
spring.jpa.open-in-view=true

# --- Server (comune) ---
server.port=${SERVER_PORT:8080}
server.address=0.0.0.0

# --- Jackson (comune) ---
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=Europe/Rome
