spring.application.name=gestione-pattuglie

# --- Datasource (MySQL) ---
# In produzione: valorizzare tramite variabili d'ambiente, non hardcoded.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/gestione_pattuglie?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- JWT ---
# In produzione: valorizzare jwt.secret con una chiave lunga e casuale tramite variabile d'ambiente.
jwt.secret=${JWT_SECRET:CAMBIA_QUESTA_CHIAVE_SEGRETA_IN_PRODUZIONE_MIN_32_BYTE}
jwt.expiration-ms=28800000

# --- Geocodifica indirizzi (Nominatim / OpenStreetMap) ---
# Nessuna API key richiesta. Rispettare il limite d'uso di ~1 richiesta/secondo
# (uso "on demand" da form admin, non per geocodifiche massive).
geocoding.nominatim.base-url=https://nominatim.openstreetmap.org
geocoding.nominatim.user-agent=GestionePattuglieApp/1.0 (contatto@istituto-vigilanza.it)
geocoding.paese-default=it

# --- Prezzo carburante (dataset ufficiale MIMIT, aggiornato quotidianamente) ---
# Nessuna API key richiesta. Il valore è tenuto in cache lato server per non
# interrogare il sito ad ogni richiesta di ottimizzazione rotta.
fuel-price.mimit.csv-url=https://www.mimit.gov.it/images/stories/carburanti/MediaRegionaleStradale.csv
fuel-price.cache-minutes=180

# --- Server ---
server.port=${SERVER_PORT:8080}

# --- Static resources (frontend Angular compilato, servito dal jar unico) ---
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
