# ============================================================
# Profilo PRODUZIONE — è il profilo Spring attivo di default nel jar compilato
# con:
#   mvn clean package -Pprod        (profilo di compilazione Maven "prod", vedi
#                                     pom.xml: imprime spring.profiles.active=prod)
#
# In alternativa, su un jar già compilato (es. quello Docker con profilo "dev"
# di default), si può forzare questo profilo a runtime senza ricompilare con:
#   SPRING_PROFILES_ACTIVE=prod java -jar app.jar
#
# I parametri di connessione al database riportano i valori ATTUALMENTE in uso
# sul server di produzione (già presenti in precedenza come default del file di
# configurazione generico, ora spostati qui dove è chiaro che si tratta di
# credenziali reali). Restano comunque sovrascrivibili con le variabili
# d'ambiente DB_HOST / DB_USERNAME / DB_PASSWORD: è preferibile passarle tramite
# un secret manager (o comunque non versionato) invece di tenerle in questo file,
# soprattutto se il repository viene condiviso con terzi.
# ============================================================

spring.datasource.url=jdbc:sqlserver://${DB_HOST:192.168.254.233}:${DB_PORT:1433};databaseName=${DB_NAME:gestione_pattuglie};encrypt=${DB_ENCRYPT:false};trustServerCertificate=${DB_TRUST_SERVER_CERT:true}
spring.datasource.username=${DB_USERNAME:a.calabrese}
spring.datasource.password=${DB_PASSWORD:Cosmopol2022?!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:20000}

# In produzione lo schema NON va mai modificato in automatico: solo verifica di
# corrispondenza. Le migrazioni si applicano a mano eseguendo db/schema.sql.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# CORS e segreto JWT restano SENZA default: se la variabile d'ambiente non è
# impostata, l'avvio fallisce subito con un errore chiaro, invece di partire
# silenziosamente con un'origine o un segreto di sviluppo per errore.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.security.jwt-secret=${JWT_SECRET:segreto_di_sviluppo_docker_non_usare_in_produzione_min32car}
app.security.jwt-expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
